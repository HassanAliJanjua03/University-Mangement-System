<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Main menu routes to three functions"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6bdcc4"/></marker></defs><rect width="1200" height="320" rx="14" fill="#172c40"/><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="39" font-size="22" font-weight="700" fill="#f3f8fc">Application flow</text><rect x="438" y="57" width="324" height="62" rx="9" fill="#1e4656" stroke="#6bdcc4"/><text x="600" y="83" font-size="19" font-weight="700" text-anchor="middle" fill="#f3f8fc">Main menu</text><text x="600" y="104" font-size="13" text-anchor="middle" fill="#bad5df">Select an option</text><g fill="none" stroke="#6bdcc4" stroke-width="2" marker-end="url(#a)"><path d="M600 119V146H200V173"/><path d="M600 119V173"/><path d="M600 119V146H1000V173"/></g><g fill="#203d53" stroke="#507589"><rect x="38" y="178" width="324" height="100" rx="10"/><rect x="438" y="178" width="324" height="100" rx="10"/><rect x="838" y="178" width="324" height="100" rx="10"/></g><g fill="#72dfc7" font-size="14" font-weight="700"><text x="57" y="200">01 / PORTAL</text><text x="457" y="200">02 / CAFÉ</text><text x="857" y="200">03 / GAME</text></g><g fill="#f3f8fc" font-size="20" font-weight="700"><text x="57" y="229">portal()</text><text x="457" y="229">cafe()</text><text x="857" y="229">game()</text></g><g fill="#b9d1df" font-size="14"><text x="57" y="253">Login · Enter or check marks</text><text x="457" y="253">Choose items · Calculate total</text><text x="857" y="253">Alternate turns · Win or draw</text></g><text x="34" y="304" font-size="13" fill="#9ebac9">After a module completes, the main program asks whether to restart.</text></g></svg>