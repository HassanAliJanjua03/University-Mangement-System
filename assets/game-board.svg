<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Illustrative Tic-Tac-Toe board with numbered positions and example X and O moves"><rect width="560" height="360" rx="14" fill="#172c40"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="42" font-size="24" font-weight="700" fill="#f3f8fc">Tic-Tac-Toe</text><text x="28" y="66" font-size="13" fill="#a9c5d3">Player 1 · X     /     Player 2 · O</text><g fill="#203d53" stroke="#46677d"><rect x="167" y="84" width="70" height="70" rx="7"/><rect x="245" y="84" width="70" height="70" rx="7"/><rect x="323" y="84" width="70" height="70" rx="7"/><rect x="167" y="162" width="70" height="70" rx="7"/><rect x="245" y="162" width="70" height="70" rx="7"/><rect x="323" y="162" width="70" height="70" rx="7"/><rect x="167" y="240" width="70" height="70" rx="7"/><rect x="245" y="240" width="70" height="70" rx="7"/><rect x="323" y="240" width="70" height="70" rx="7"/></g><g text-anchor="middle" font-size="28" font-weight="700" fill="#b8cbd7"><text x="202" y="130" fill="#b8cbd7">1</text><text x="280" y="130" fill="#b8cbd7">2</text><text x="358" y="130" fill="#72dfc7">X</text><text x="202" y="208" fill="#b8cbd7">4</text><text x="280" y="208" fill="#f1bb74">O</text><text x="358" y="208" fill="#b8cbd7">6</text><text x="202" y="286" fill="#b8cbd7">7</text><text x="280" y="286" fill="#b8cbd7">8</text><text x="358" y="286" fill="#72dfc7">X</text></g><text x="28" y="338" font-size="13" fill="#a9c5d3">Illustrative board state, not a recorded game result.</text></g></svg>